<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gym Time</title>
    <style>
      /* Only layout the UI kit does not cover; theme tokens come from the host. */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 10;
        background-color: var(--bg);
        border-bottom: 1px solid currentColor;
        padding-bottom: var(--s-half);
      }
      .app-header__row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: var(--s-half);
      }
      .app-header h1 {
        margin: 0;
        font-size: 1.25rem;
      }
      .user-switcher {
        display: inline-flex;
        align-items: center;
        gap: var(--s-half);
        width: auto;
      }
      .user-switcher select {
        width: auto;
        min-width: 8rem;
      }
      #menu {
        position: static;
        display: flex;
        flex-direction: column;
        gap: var(--s-half);
        padding-top: var(--s-half);
      }
      #menu button {
        text-align: left;
      }
      #menu button[aria-pressed='true'] {
        font-weight: 600;
      }
      [hidden] {
        display: none !important;
      }
      dialog:not([open]) {
        display: none !important;
      }
      .card h2,
      .card h3 {
        margin: 0;
      }
      .card .row input[type='number'] {
        width: 5.5rem;
      }
      dialog {
        width: min(92vw, 30rem);
      }
      dialog fieldset {
        border: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: var(--s-half);
      }
      dialog label {
        display: flex;
        align-items: center;
        gap: var(--s-half);
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main class="page stack">
      <header class="app-header">
        <div class="app-header__row">
          <button id="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
            <span class="material-icons" aria-hidden="true">menu</span>
          </button>
          <h1 class="grow">Gym Time</h1>
          <span id="today" class="text-muted"></span>
          <label class="user-switcher" for="profile-select">
            <span class="material-icons" aria-hidden="true">person</span>
            <select id="profile-select" aria-label="Switch user"></select>
          </label>
        </div>
        <nav id="menu" hidden aria-label="Sections">
          <button id="menu-workout" type="button" aria-pressed="true">Workout</button>
          <button id="menu-history" type="button" aria-pressed="false">History</button>
          <button id="menu-exercises" type="button" aria-pressed="false">Exercises</button>
          <button id="menu-progress" type="button" aria-pressed="false">Progress</button>
          <button id="menu-settings" type="button" aria-pressed="false">Settings</button>
        </nav>
      </header>
      <section id="view-workout" class="stack" aria-label="Workout"></section>
      <section id="view-history" class="stack" aria-label="History" hidden></section>
      <section id="view-exercises" class="stack" aria-label="Exercises" hidden></section>
      <section id="view-progress" class="stack" aria-label="Progress" hidden></section>
      <section id="view-settings" class="stack" aria-label="Settings" hidden></section>
    </main>
    <!--APP_SCRIPT-->
  </body>
</html>
